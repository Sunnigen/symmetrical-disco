# Publishes site/ to GitHub Pages. This works ONLY after a repo admin enables
# Pages once: Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (NOT "Deploy from a branch"). The workflow token cannot create the Pages site
# itself ("Resource not accessible by integration"); that first enable is the one
# pending owner click. After that, every push to the working branch redeploys, so
# the live P&L stays current.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/experiment-b7d1dq]
    paths: [site/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
