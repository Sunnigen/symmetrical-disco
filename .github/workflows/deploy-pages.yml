# Disabled trigger: GitHub Actions currently fails at startup on this repo
# (likely account billing/limits — even a bare echo workflow dies in ~3s), and
# Pages requires a public repo on the free plan. Kept as manual-dispatch so it
# can be re-tested if either condition changes.
name: Deploy dashboard to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
